services:
  database:
    image: postgres:15-alpine
    container_name: craftforge-db
    environment:
      POSTGRES_USER: craftforge_admin
      POSTGRES_PASSWORD: password_seguro_local
      POSTGRES_DB: craftforge_db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - craftforge-net

  cache-broker:
    image: redis:7-alpine
    container_name: craftforge-cache
    networks:
      - craftforge-net

  backend-api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: craftforge-api
    environment:
      DATABASE_URL: postgres://craftforge_admin:password_seguro_local@database:5432/craftforge_db
      REDIS_URL: redis://cache-broker:6379
      CURSEFORGE_BASE_URL: https://api.curseforge.com
      PORT: 3000
      SCRATCH_BASE_DIR: /app/scratch
    volumes:
      - shared-scratch:/app/scratch
      - ./secret.properties:/app/secret.properties:ro
    depends_on:
      - database
      - cache-broker
    ports:
      - "3000:3000"
    networks:
      - craftforge-net

  queue-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: craftforge-worker
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgres://craftforge_admin:password_seguro_local@database:5432/craftforge_db
      REDIS_URL: redis://cache-broker:6379
      CURSEFORGE_BASE_URL: https://api.curseforge.com
      SCRATCH_BASE_DIR: /app/scratch
      WORKER_MAX_PARALLEL_DOWNLOADS: 3
    volumes:
      - shared-scratch:/app/scratch
      - ./secret.properties:/app/secret.properties:ro
    depends_on:
      - database
      - cache-broker
    networks:
      - craftforge-net

  frontend:
    image: nginx:alpine
    container_name: craftforge-ui
    ports:
      - "8080:80"
    volumes:
      - ./apps/frontend:/usr/share/nginx/html:ro
      - ./apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
    networks:
      - craftforge-net

volumes:
  db-data:
  shared-scratch:

networks:
  craftforge-net:
    driver: bridge
